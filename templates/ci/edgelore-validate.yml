# Copia este fichero a .github/workflows/ en el repositorio donde uses Edgelore.
#
# Es la unica defensa automatica contra que el indice acumule mentiras: valida
# que los ficheros referenciados existen y que el esquema es correcto. No puede
# saber si un hecho es falso, pero si que ha dejado de ser coherente.

name: edgelore

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # edgelore stale necesita el historial
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Ajusta la instalacion si aun no publicais el paquete en npm.
      - run: npm install -g edgelore
      - run: edgelore validate
      # Informativo: no bloquea el merge, pero deja visible lo que hay por revisar.
      - run: edgelore stale || true
